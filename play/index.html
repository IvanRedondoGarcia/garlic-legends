<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a0f24" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Garlic Legends: IDLE RPG</title>
    <style>html,body{touch-action:none;-webkit-user-select:none;user-select:none;background:#1a0f24;width:100%;height:100%;margin:0;padding:0;overflow:hidden}#game{z-index:1;width:100%;height:100%;position:relative}#side-fill{z-index:0;filter:blur(24px)brightness(.5)saturate(1.15);background:#1a0f24 50%/cover no-repeat;transition:background-image .6s;position:fixed;inset:-40px}#loading{z-index:10;background:radial-gradient(circle at 50% 42%,#3a1d55 0%,#1a0f24 62%);flex-direction:column;justify-content:center;align-items:center;gap:18px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:opacity .45s;display:flex;position:fixed;inset:0}#loading.hidden{opacity:0;pointer-events:none}#loading img{border-radius:30px;width:132px;height:132px;animation:1.6s ease-in-out infinite loading-bob;box-shadow:0 0 40px #c178ff8c}#loading .name{color:#fff;letter-spacing:.5px;text-shadow:0 3px #2a0f3d,0 0 18px #c178ff99;font-size:30px;font-weight:800}#loading .bar{background:#ffffff1f;border:2px solid #e8b84a;border-radius:7px;width:min(70vw,320px);height:14px;overflow:hidden}#loading .fill{background:linear-gradient(90deg,#9b4fd6,#f0c95a);width:4%;height:100%;transition:width .25s}@keyframes loading-bob{50%{transform:translateY(-8px)scale(1.03)}}</style>
    <script type="module" crossorigin src="./assets/index-Dgwga7Xl.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">
      <img src="./icon-192.png" alt="" />
      <div class="name">Garlic Legends</div>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <script>
      // Pantalla de carga: se ve antes de que arranque el juego, que la va llenando y la quita (src/game/loadingScreen.ts)
      (function () {
        var el = document.getElementById('loading');
        var fill = el.querySelector('.fill');
        window.__loading = {
          set: function (p) {
            fill.style.width = Math.max(4, Math.min(100, Math.round(p * 100))) + '%';
          },
          done: function () {
            el.classList.add('hidden');
            setTimeout(function () {
              el.remove();
            }, 600);
          },
        };
      })();
    </script>
  </body>
</html>
